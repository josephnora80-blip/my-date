<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سؤال مهم 😄</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e9;
            font-family: sans-serif;
            text-align: center;
        }
        h1 { color: #d63384; font-size: 2rem; margin-bottom: 30px; }
        .buttons { display: flex; gap: 20px; position: relative; }
        button {
            padding: 15px 30px; font-size: 1.2rem; font-weight: bold;
            border: none; border-radius: 12px; cursor: pointer;
        }
        #yesBtn { background-color: #28a745; color: white; }
        #noBtn {
            background-color: #dc3545; color: white;
            position: absolute; left: 110px; transition: 0.15s ease;
        }
    </style>
</head>
<body>
    <h1>تقبلي تخرجي معايا؟ ☕✨</h1>
    <div class="buttons">
        <button id="yesBtn" onclick="accepted()">Yes ❤️</button>
        <button id="noBtn" onclick="moveButton()" ontouchstart="moveButton()">No 😜</button>
    </div>
    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40);
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }
        function accepted() {
            // اكتب رقم الواتساب ديالك هنا بالرمز الدولي (مثلا المغرب 212)
            let phoneNumber = "212631752271"; 
            let message = "صافي قبلت نخرج معاك! 😉☕";
            
            let url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.location.href = url;
        }
    </script>
</body>
</html>
