<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Little Question ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e4, #fff5f8);
    color: #3b2530;
    overflow: hidden;
}

.card {
    width: 100%;
    max-width: 430px;
    background: white;
    border-radius: 30px;
    padding: 35px 24px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(100, 40, 70, 0.2);
    position: relative;
    z-index: 2;
}

.heart {
    font-size: 65px;
    animation: pulse 1.4s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.12);
    }
}

h1 {
    font-size: 28px;
    margin: 15px 0;
}

p {
    font-size: 17px;
    line-height: 1.6;
    color: #705b64;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 28px;
}

button {
    border: none;
    border-radius: 50px;
    padding: 15px 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(0,0,0,0.12);
}

#yes {
    background: #ff4f7b;
    color: white;
}

#no {
    background: #eeeeee;
    color: #555;
}

#hint {
    margin-top: 20px;
    font-size: 13px;
    color: #9a7c88;
}

#datePage {
    display: none;
}

.places {
    display: grid;
    gap: 12px;
    margin-top: 25px;
}

.place {
    width: 100%;
    background: #fff0f4;
    color: #c93661;
    font-size: 17px;
}

.place:hover {
    transform: scale(1.02);
}

#whatsapp {
    display: none;
    width: 100%;
    margin-top: 20px;
    background: #25D366;
    color: white;
    font-size: 17px;
}

#selected {
    font-weight: bold;
    color: #c93661;
    margin-top: 20px;
}

.float {
    position: fixed;
    bottom: -40px;
    font-size: 25px;
    animation: floatUp 7s linear forwards;
    z-index: 1;
}

@keyframes floatUp {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: 0.8;
    }

    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="card">

    <!-- الصفحة الأولى -->
    <div id="questionPage">

        <div class="heart">❤️</div>

        <h1>I have a little question...</h1>

        <p>
            Would you like to go on a date with me? 😌
        </p>

        <div class="buttons">

            <button id="yes">
                YES ❤️
            </button>

            <button id="no">
                NO 🙈
            </button>

        </div>

        <div id="hint">
            Be honest... 😂
        </div>

    </div>


    <!-- صفحة اختيار المكان -->
    <div id="datePage">

        <div class="heart">🥰</div>

        <h1>Yaaay! ❤️</h1>

        <p>
            Now you choose where we should go 😌
        </p>

        <div class="places">

            <button class="place"
                onclick="choosePlace('☕ A Café')">
                ☕ A Café
            </button>

            <button class="place"
                onclick="choosePlace('🍕 A Restaurant')">
                🍕 A Restaurant
            </button>

            <button class="place"
                onclick="choosePlace('🎬 The Cinema')">
                🎬 The Cinema
            </button>

            <button class="place"
                onclick="choosePlace('🌅 A Walk')">
                🌅 A Walk
            </button>

            <button class="place"
                onclick="choosePlace('🎡 Somewhere fun')">
                🎡 Somewhere fun
            </button>

        </div>

        <p id="selected"></p>

        <button id="whatsapp" onclick="sendWhatsApp()">
            💬 Send my answer on WhatsApp
        </button>

    </div>

</div>


<script>

const noButton = document.getElementById("no");
const yesButton = document.getElementById("yes");
const hint = document.getElementById("hint");

let attempts = 0;
let selectedPlace = "";

const phrases = [
    "Are you sure? 😂",
    "Think again 😌",
    "Give me a chance ❤️",
    "One more try? 🥹",
    "The NO button is getting nervous 😂",
    "Maybe YES? 😏"
];


// زر NO
noButton.addEventListener("click", function() {

    attempts++;

    hint.textContent =
        phrases[Math.min(attempts - 1, phrases.length - 1)];

    const x = Math.random() * 160 - 80;
    const y = Math.random() * 100 - 50;

    noButton.style.transform =
        "translate(" + x + "px, " + y + "px)";

    if (attempts >= 5) {
        noButton.textContent = "Maybe? 😏";
    }

});


// زر YES
yesButton.addEventListener("click", function() {

    document.getElementById("questionPage").style.display = "none";

    document.getElementById("datePage").style.display = "block";

    for (let i = 0; i < 20; i++) {
        createHeart();
    }

});


// اختيار المكان
function choosePlace(place) {

    selectedPlace = place;

    document.getElementById("selected").textContent =
        "Perfect choice! ❤️ " + place;

    document.getElementById("whatsapp").style.display =
        "block";
}


// فتح WhatsApp
function sendWhatsApp() {

    const phone = "212631752271";

    const message =
        "I said YES ❤️\n\n" +
        "And I choose " + selectedPlace + " 😌\n\n" +
        "So... when are we going? ❤️";

    const url =
        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(message);

    window.location.href = url;
}


// قلوب متحركة
function createHeart() {

    const heart = document.createElement("div");

    heart.className = "float";

    const emojis = [
        "❤️",
        "💕",
        "✨",
        "🌸"
    ];

    heart.textContent =
        emojis[Math.floor(Math.random() * emojis.length)];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.animationDelay =
        Math.random() * 2 + "s";

    document.body.appendChild(heart);

    setTimeout(function() {
        heart.remove();
    }, 7500);
}

</script>

</body>
</html>
