<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سؤال صغير ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:Arial,"Tahoma",sans-serif; overflow:hidden;
  background:linear-gradient(135deg,#ffe6ee,#fff7fb);
}
.card{
  width:min(92%,430px); padding:38px 22px; text-align:center;
  background:rgba(255,255,255,.92); border-radius:28px;
  box-shadow:0 15px 45px rgba(180,70,110,.18);
}
.heart{font-size:58px; animation:pulse 1.2s infinite}
h1{font-size:27px;color:#4a2432;margin:12px 0 30px}
.buttons{position:relative;height:75px;display:flex;justify-content:center;gap:14px}
button{
  border:0;border-radius:18px;padding:15px 25px;font-size:18px;font-weight:bold;
  cursor:pointer;touch-action:manipulation;box-shadow:0 7px 18px rgba(0,0,0,.10);
}
#yes{background:#ff5c8a;color:white}
#no{background:#eee;color:#555;position:absolute}
#message{display:none;font-size:22px;line-height:1.7;color:#6b263f;font-weight:bold}
.small{margin-top:18px;color:#999;font-size:13px}
@keyframes pulse{50%{transform:scale(1.12)}}
</style>
</head>
<body>
<div class="card">
  <div class="heart">❤️</div>
  <h1 id="question">واش تقبلي تخرجي معايا؟ 😊</h1>

  <div class="buttons" id="buttons">
    <button id="yes">Yes 😍</button>
    <button id="no">No 😅</button>
  </div>

  <div id="message">
    عرفت بلي غادي تقولي Yes 😂❤️<br>
    دابا بقى غير نحددو النهار 😌
  </div>

  <div class="small">اختاري جوابك بصراحة... 😄</div>
</div>

<script>
const no = document.getElementById("no");
const yes = document.getElementById("yes");
const buttons = document.getElementById("buttons");
const message = document.getElementById("message");
const question = document.getElementById("question");

const words = [
  "متأكدة؟ 🥺",
  "فكري مزيان 😂",
  "علاش No؟ 😭",
  "عطيني فرصة 😌",
  "آخر محاولة؟ 🥹",
  "واش بصح؟ 😂❤️"
];

let count = 0;

function changeNo(e){
  if(e) e.preventDefault();
  no.textContent = words[count % words.length];
  count++;

  const maxX = Math.max(0, buttons.clientWidth - no.offsetWidth);
  const maxY = Math.max(0, buttons.clientHeight - no.offsetHeight);
  no.style.left = Math.random() * maxX + "px";
  no.style.top = Math.random() * maxY + "px";
}

no.addEventListener("mouseenter", changeNo);
no.addEventListener("touchstart", changeNo, {passive:false});
no.addEventListener("click", changeNo);

yes.addEventListener("click",()=>{
  buttons.style.display="none";
  question.style.display="none";
  message.style.display="block";
});
</script>
</body>
</html>
