<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="مواقيت الصلاة اليومية حسب المدينة مع معرفة الصلاة القادمة والوقت المتبقي.">
<meta name="theme-color" content="#071a17">
<title>مواقيت الصلاة | صلاتي</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma, Arial, sans-serif;
    background:
      radial-gradient(circle at top, #123b34 0%, #071a17 45%, #04110f 100%);
    color:#fff;
    min-height:100vh;
}

.container{
    width:92%;
    max-width:850px;
    margin:auto;
    padding:25px 0 40px;
}

header{
    text-align:center;
    padding:20px 10px 30px;
}

.logo{
    width:65px;
    height:65px;
    border-radius:50%;
    margin:0 auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
}

h1{
    font-size:30px;
    margin-bottom:8px;
}

.subtitle{
    color:#b9d1cc;
    font-size:14px;
}

.card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    border-radius:22px;
    padding:20px;
    margin-bottom:18px;
    backdrop-filter:blur(12px);
    box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.location{
    display:flex;
    gap:10px;
    align-items:center;
}

select{
    flex:1;
    padding:14px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.15);
    background:#102b27;
    color:white;
    font-size:15px;
    outline:none;
}

button{
    border:0;
    border-radius:14px;
    padding:14px 17px;
    background:#d6b36a;
    color:#10201c;
    font-weight:bold;
    cursor:pointer;
}

.date{
    text-align:center;
}

.gregorian{
    font-size:18px;
    margin-bottom:7px;
}

.hijri{
    color:#d6b36a;
    font-size:15px;
}

.clock{
    text-align:center;
    font-size:43px;
    font-weight:bold;
    letter-spacing:2px;
    margin:10px 0;
}

.next{
    text-align:center;
}

.next-label{
    color:#b9d1cc;
    font-size:14px;
    margin-bottom:8px;
}

.next-name{
    font-size:27px;
    color:#d6b36a;
    font-weight:bold;
}

.remaining{
    margin-top:8px;
    font-size:17px;
}

.prayers{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.prayer{
    padding:18px;
    border-radius:18px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    transition:.2s;
}

.prayer.active{
    background:rgba(214,179,106,.15);
    border-color:#d6b36a;
    transform:translateY(-2px);
}

.prayer-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.prayer-name{
    font-size:16px;
}

.icon{
    font-size:20px;
}

.prayer-time{
    font-size:25px;
    font-weight:bold;
    color:#d6b36a;
}

.info{
    color:#aac2bd;
    font-size:13px;
    line-height:1.8;
    text-align:center;
}

footer{
    text-align:center;
    color:#718d87;
    font-size:12px;
    padding-top:10px;
}

.loading{
    text-align:center;
    padding:25px;
    color:#b9d1cc;
}

.error{
    text-align:center;
    color:#ffb4a9;
    line-height:1.8;
}

@media(max-width:500px){
    .container{
        width:94%;
        padding-top:10px;
    }

    h1{
        font-size:26px;
    }

    .clock{
        font-size:36px;
    }

    .prayers{
        grid-template-columns:1fr;
    }

    .location{
        flex-direction:column;
    }

    select,button{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">🕌</div>
    <h1>صلاتي</h1>
    <p class="subtitle">مواقيت الصلاة اليومية</p>
</header>

<div class="card">
    <div class="location">
        <select id="city">
            <option value="Rabat">الرباط</option>
            <option value="Sale">سلا</option>
            <option value="Casablanca">الدار البيضاء</option>
            <option value="Fes">فاس</option>
            <option value="Marrakesh">مراكش</option>
            <option value="Tangier">طنجة</option>
            <option value="Meknes">مكناس</option>
            <option value="Agadir">أكادير</option>
            <option value="Oujda">وجدة</option>
            <option value="Kenitra">القنيطرة</option>
            <option value="Tetouan">تطوان</option>
            <option value="El Jadida">الجديدة</option>
            <option value="Beni Mellal">بني ملال</option>
            <option value="Nador">الناظور</option>
        </select>

        <button onclick="loadPrayerTimes()">تحديث المواقيت</button>
    </div>
</div>

<div class="card date">
    <div class="gregorian" id="gregorian">جاري التحميل...</div>
    <div class="hijri" id="hijri">...</div>
</div>

<div class="card">
    <div class="clock" id="clock">00:00:00</div>
</div>

<div class="card next">
    <div class="next-label">الصلاة القادمة</div>
    <div class="next-name" id="nextName">...</div>
    <div class="remaining" id="remaining">جاري الحساب...</div>
</div>

<div class="card">
    <div id="prayerList" class="loading">
        جاري تحميل مواقيت الصلاة...
    </div>
</div>

<div class="card info">
    مواقيت الصلاة تقريبية حسب طريقة الحساب المعتمدة، وقد تختلف دقائق قليلة حسب الموقع وطريقة الحساب المحلية.
</div>

<footer>
    © 2026 صلاتي — جميع الحقوق محفوظة
</footer>

</div>

<script>

const prayerNames = {
    Fajr: "الفجر",
    Sunrise: "الشروق",
    Dhuhr: "الظهر",
    Asr: "العصر",
    Maghrib: "المغرب",
    Isha: "العشاء"
};

const prayerIcons = {
    Fajr: "🌅",
    Sunrise: "☀️",
    Dhuhr: "🌞",
    Asr: "🌤️",
    Maghrib: "🌇",
    Isha: "🌙"
};

let timings = {};
let timerInterval;

function formatTime(time){
    return time ? time.substring(0,5) : "--:--";
}

function updateClock(){

    const now = new Date();

    const h = String(now.getHours()).padStart(2,"0");
    const m = String(now.getMinutes()).padStart(2,"0");
    const s = String(now.getSeconds()).padStart(2,"0");

    document.getElementById("clock").textContent =
        `${h}:${m}:${s}`;

    updateNextPrayer();
}

function getTodayPrayer(name){

    const value = timings[name];

    if(!value) return null;

    const [hours, minutes] = value.split(":").map(Number);

    const date = new Date();

    date.setHours(hours, minutes, 0, 0);

    return date;
}

function updateNextPrayer(){

    if(!timings.Fajr) return;

    const now = new Date();

    const order = [
        "Fajr",
        "Dhuhr",
        "Asr",
        "Maghrib",
        "Isha"
    ];

    let next = null;
    let nextTime = null;

    for(const name of order){

        const time = getTodayPrayer(name);

        if(time && time > now){
            next = name;
            nextTime = time;
            break;
        }
    }

    if(!next){

        next = "Fajr";

        nextTime = getTodayPrayer("Fajr");

        if(nextTime){
            nextTime.setDate(nextTime.getDate()+1);
        }
    }

    document.getElementById("nextName").textContent =
        prayerNames[next];

    if(nextTime){

        let difference = nextTime - now;

        if(difference < 0){
            difference = 0;
        }

        const hours = Math.floor(difference / 3600000);
        const minutes = Math.floor((difference % 3600000) / 60000);
        const seconds = Math.floor((difference % 60000) / 1000);

        document.getElementById("remaining").textContent =
            `متبقي ${hours} ساعة و ${minutes} دقيقة و ${seconds} ثانية`;
    }

    highlightPrayer(next);
}

function highlightPrayer(next){

    document.querySelectorAll(".prayer").forEach(el=>{
        el.classList.remove("active");

        if(el.dataset.name === next){
            el.classList.add("active");
        }
    });
}

function displayPrayers(){

    const list = document.getElementById("prayerList");

    const order = [
        "Fajr",
        "Sunrise",
        "Dhuhr",
        "Asr",
        "Maghrib",
        "Isha"
    ];

    list.className = "prayers";

    list.innerHTML = "";

    order.forEach(name => {

        const div = document.createElement("div");

        div.className = "prayer";
        div.dataset.name = name;

        div.innerHTML = `
            <div class="prayer-top">
                <span class="prayer-name">
                    ${prayerNames[name]}
                </span>

                <span class="icon">
                    ${prayerIcons[name]}
                </span>
            </div>

            <div class="prayer-time">
                ${formatTime(timings[name])}
            </div>
        `;

        list.appendChild(div);
    });
}

function updateDate(data){

    if(data && data.date){

        const gregorian = data.date.gregorian;

        const hijri = data.date.hijri;

        document.getElementById("gregorian").textContent =
            `${gregorian.day} ${gregorian.month.en} ${gregorian.year}`;

        document.getElementById("hijri").textContent =
            `${hijri.day} ${hijri.month.ar} ${hijri.year} هـ`;
    }
}

async function loadPrayerTimes(){

    const city =
        document.getElementById("city").value;

    const list =
        document.getElementById("prayerList");

    list.className = "loading";

    list.textContent =
        "جاري تحميل مواقيت الصلاة...";

    try{

        const url =
        `https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=Morocco&method=21`;

        const response = await fetch(url);

        if(!response.ok){
            throw new Error("Network error");
        }

        const result = await response.json();

        if(result.code !== 200){
            throw new Error("API error");
        }

        timings = result.data.timings;

        displayPrayers();

        updateDate(result.data);

        updateNextPrayer();

    }catch(error){

        list.className = "error";

        list.innerHTML = `
            ⚠️ تعذر تحميل مواقيت الصلاة.<br>
            تأكد من اتصال الهاتف بالإنترنت ثم حاول مرة أخرى.
        `;
    }
}

document
.getElementById("city")
.addEventListener("change", loadPrayerTimes);

updateClock();

setInterval(updateClock,1000);

loadPrayerTimes();

</script>

</body>
</html>
